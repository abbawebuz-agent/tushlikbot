name: ${COMPOSE_PROJECT_NAME:-tushlikbot}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-tushlikbot}"
      POSTGRES_USER: "${POSTGRES_USER:-tushlikbot}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change_me}"
    volumes:
      - pg_data:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      # Все S3-переменные для статики (USE_S3_STATIC, AWS_*) читаются отсюда.
      # entrypoint запускает `collectstatic`, поэтому при USE_S3_STATIC=true
      # статика админки заливается прямо в S3-бакет на старте контейнера.
      - .env
    environment:
      WEB_PORT: "8000"
      # FSM (MemoryStorage): один воркер, иначе шаги бота теряются между webhook-запросами
      WEB_CONCURRENCY: "1"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
    volumes:
      # static_data используется только при локальной раздаче статики (USE_S3_STATIC=false).
      # При USE_S3_STATIC=true том можно не монтировать — статика уходит в S3.
      - static_data:/app/static
      - media_data:/app/media

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      # внешний nginx на сервере должен проксировать на этот порт (localhost:8080)
      - "${INTERNAL_NGINX_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro

  telegram-webhook:
    build: .
    profiles: ["ops"]
    env_file:
      - .env
    command: ["python", "scripts/set_telegram_webhook.py"]

volumes:
  pg_data:
  static_data:
  media_data:

